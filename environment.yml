name: rivwq
channels:
  - conda-forge
dependencies:
  - python=3.12

  # Core Scientific Sstack
  - numpy=2.2.6
  - pandas=2.2.3
  - scipy=1.16.2
  - scikit-learn=1.7.2
  - statsmodels=0.14.5
  - matplotlib=3.10.7
  - seaborn=0.13.2
  - tqdm=4.67.1

  # Geospatial
  - rasterio=1.4.3
  - pyproj=3.7.2
  - shapely=2.1.2
  - cartopy=0.25.0
  - xarray=2025.10.1

  # Jupyter
  - jupyterlab=4.4.9
  - ipykernel=6.30.1

  # Better via pip
  - pip
  - pip:
    - earthengine-api==1.5.17
    - geocat.viz==2025.7.0
    - cmaps==2.0.1
    - shap==0.49.1
    - scikit-optimize==0.10.2
    - xgboost==3.1.1
    - metpy==1.7.1
    - pyaml==25.7.0